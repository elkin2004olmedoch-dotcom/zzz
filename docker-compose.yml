services:
  db:
    image: postgres:18-alpine
    container_name: ogadmin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ogadmin}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ogadmin_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./BaseDatos_Productos.sql:/docker-entrypoint-initdb.d/001-productos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: