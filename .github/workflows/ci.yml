name: CI Backend

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ogadmin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ogadmin_local
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ogadmin"
          --health-interval=10s
          --timeout=5s
          --retries=10

    env:
      DATABASE_URL: postgresql://postgres:ogadmin_local@localhost:5433/ogadmin?schema=public
      PORT: 5052
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: ogadmin
      DB_USER: postgres
      DB_PASSWORD: ogadmin_local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Validate app syntax
        run: npm run validate

      - name: Run security audit
        run: npm run audit:prod
